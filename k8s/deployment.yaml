apiVersion: apps/v1
kind: Deployment

metadata:
  name: devopsrag-api
  namespace: devopsrag

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devopsrag-api

  template:
    metadata:
      labels:
        app: devopsrag-api

    spec:
      containers:
        - name: devopsrag-api

          image: rohitbansal2113/devopsrag-api:10

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.minikube.internal:11434"

            - name: LLM_MODEL
              value: "llama3.2"

            - name: PROJECT_ROOT
              value: "/app"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"

            limits:
              memory: "2Gi"
              cpu: "1"
